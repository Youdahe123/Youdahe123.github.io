<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container writing-container">
        <div class="title">
            <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>
            <h1 class="nostyle"><a class="name" href="index.html">Youdahe Asfaw</a></h1>
            <a class="extra" href="writing.html">Writing</a>
            <a class="extra" href="photography.html">Photography</a>
            <a class="extra" href="recruiter.html">For Recruiters</a>
            <a class="extra" href="Youdahe_Asfaw_SoftwareEngineer.pdf" target="_blank" rel="noopener noreferrer">Resume</a>
            <a class="extra" href="https://github.com/Youdahe123" target="_blank" rel="noopener noreferrer">Github</a>
        </div>

        <section class="writing">
            <h1 class="writing-title">Writing</h1>
            <p class="writing-subtitle">Thoughts on systems, startups, and building things.</p>

            <div class="post-list" id="postList"></div>
        </section>
    </main>

    <div class="footer-bar"></div>

    <script src="script.js"></script>
    <script src="posts.js"></script>
    <script>
        (async () => {
            const posts = await getPosts();
            const container = document.getElementById('postList');

            if (posts.length === 0) {
                container.innerHTML = '<p class="writing-empty">Nothing yet, check back soon.</p>';
            } else {
                container.innerHTML = posts.map(post => `
                    <a href="post.html?id=${post.id}" class="post-item">
                        <span class="post-date">${new Date(post.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}</span>
                        <h2 class="post-heading">${post.title}</h2>
                        <p class="post-preview">${post.preview}</p>
                    </a>
                `).join('');
            }
        })();
    </script>
</body>
</html>
