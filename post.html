<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>post · youdahe.com</title>
    <link rel="icon" type="image/jpeg" href="thumbnails/757728ea03cf11b495d92a9852a9f060.jpg">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container writing-container">
        <div class="title">
            <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>
            <h1 class="nostyle"><a class="name" href="index.html">Youdahe Asfaw</a></h1>
            <a class="extra" href="writing.html">Writing</a>
            <a class="extra" href="photography.html">Photography</a>
            <a class="extra" href="recruiter.html">For Recruiters</a>
            <a class="extra" href="Youdahe_Asfaw_SoftwareEngineer.pdf" target="_blank" rel="noopener noreferrer">Resume</a>
            <a class="extra" href="https://github.com/Youdahe123" target="_blank" rel="noopener noreferrer">Github</a>
        </div>

        <article id="postContent">
            <p class="writing-loading">Loading...</p>
        </article>
    </main>

    <div class="footer-bar"></div>

    <script src="script.js"></script>
    <script src="posts.js"></script>
    <script>
        (async () => {
            const id = new URLSearchParams(window.location.search).get('id');
            const container = document.getElementById('postContent');

            if (!id) {
                window.location.href = 'writing.html';
                return;
            }

            const post = await getPost(id);

            if (!post) {
                container.innerHTML = '<p>Post not found.</p><a href="writing.html" class="post-back">back to writing</a>';
                return;
            }

            document.title = `${post.title} · youdahe.com`;
            const body = renderPostContent(post.content);

            container.innerHTML = `
                <a href="writing.html" class="post-back">back</a>
                <span class="post-date">${new Date(post.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}</span>
                <h1 class="post-full-title">${post.title}</h1>
                <div class="post-body">${body}</div>

                <div class="giscus-comments"></div>
            `;

            loadGiscus();
        })();

        // Comments + reactions are handled by giscus (GitHub Discussions);
        // see https://giscus.app. Config values below come from that page
        // once Discussions is enabled on the repo.
        function loadGiscus() {
            const script = document.createElement('script');
            script.src = 'https://giscus.app/client.js';
            script.setAttribute('data-repo', 'Youdahe123/youdahe.com');
            script.setAttribute('data-repo-id', 'GISCUS_REPO_ID');
            script.setAttribute('data-category', 'Comments');
            script.setAttribute('data-category-id', 'GISCUS_CATEGORY_ID');
            script.setAttribute('data-mapping', 'pathname');
            script.setAttribute('data-reactions-enabled', '1');
            script.setAttribute('data-emit-metadata', '0');
            script.setAttribute('data-input-position', 'top');
            script.setAttribute('data-theme', 'preferred_color_scheme');
            script.setAttribute('crossorigin', 'anonymous');
            script.async = true;
            document.querySelector('.giscus-comments').appendChild(script);
        }
    </script>
</body>
</html>
