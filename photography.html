    <script>
        // Videos ship with preload="none" and only start once they scroll into
        // view, so opening the page costs the images and nothing else.
        const videos = document.querySelectorAll('[data-lazy-video]');
        if ('IntersectionObserver' in window) {
            const io = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const v = entry.target;
                    if (entry.isIntersecting) {
                        if (v.preload === 'none') v.preload = 'auto';
                        v.play().catch(() => {});
                    } else {
                        v.pause();
                    }
                });
            }, { rootMargin: '200px' });
            videos.forEach(v => io.observe(v));
        } else {
            videos.forEach(v => { v.preload = 'auto'; v.play().catch(() => {}); });
        }
    </script>
