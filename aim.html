<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aim trainer · youdahe.com</title>
    <link rel="icon" type="image/jpeg" href="thumbnails/757728ea03cf11b495d92a9852a9f060.jpg">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="aim-body">
    <!-- The arena fills the window; every panel below sits on top of it. -->
    <div class="aim-stage" id="aimStage">
        <canvas id="aimCanvas"></canvas>

        <!-- Dims the arena while the panel is up so the copy stays readable
             over whatever the targets happen to be doing behind it. -->
        <div class="aim-scrim" id="aimScrim" aria-hidden="true"></div>

        <!-- The AWP's scope: a black mask with a round window and a reticle. -->
        <div class="aim-scope" id="aimScope" aria-hidden="true" hidden></div>

        <div class="aim-crosshair" id="aimCrosshair" aria-hidden="true" hidden>
            <span></span><span></span><span></span><span></span>
        </div>

        <!-- Live readout while a run is going. -->
        <div class="aim-hud" id="aimHud" aria-hidden="true" hidden>
            <span class="aim-hud-cell"><b id="aimTime">30.0</b><i>time</i></span>
            <span class="aim-hud-cell"><b id="aimScore">0</b><i>hits</i></span>
            <span class="aim-hud-cell"><b id="aimAcc">100%</b><i>accuracy</i></span>
        </div>

        <!-- Ammo, bottom right like csgo. Tapping it reloads on a phone. -->
        <div class="aim-ammo" id="aimAmmo" hidden>
            <span class="aim-ammo-gun" id="aimAmmoGun">plasma rifle</span>
            <span class="aim-ammo-count"><b id="aimAmmoMag">40</b><i id="aimAmmoReserve">/ &infin;</i></span>
            <span class="aim-ammo-bar" aria-hidden="true"><span id="aimAmmoFill"></span></span>
        </div>

        <!-- Start, pause and results all share one menu: the game panel on the
             left, the photo and the leaderboard on the right. -->
        <div class="aim-menu" id="aimPanel">
            <div class="aim-panel">
                <a class="aim-back" href="index.html">&larr; back</a>

                <h1 class="aim-title nostyle">aim trainer</h1>

                <div class="aim-stat">
                    <span class="aim-stat-label" id="aimStatLabel">high score</span>
                    <span class="aim-stat-value" id="aimStatValue">0</span>
                    <span class="aim-stat-note" id="aimStatNote">30 seconds &middot; no runs yet</span>
                </div>

                <!-- Loadout. The chips are filled in by aim.js from its lists. -->
                <div class="aim-picks">
                    <div class="aim-pick">
                        <span class="aim-pick-label" id="aimGunLabel">gun</span>
                        <div class="aim-chips" id="aimGuns" role="radiogroup" aria-labelledby="aimGunLabel"></div>
                    </div>
                    <div class="aim-pick">
                        <span class="aim-pick-label" id="aimReloadLabel">reloading</span>
                        <div class="aim-chips" id="aimReloads" role="radiogroup" aria-labelledby="aimReloadLabel"></div>
                    </div>
                    <div class="aim-pick">
                        <span class="aim-pick-label" id="aimTargetLabel">target</span>
                        <div class="aim-chips" id="aimTargets" role="radiogroup" aria-labelledby="aimTargetLabel"></div>
                    </div>
                    <div class="aim-pick">
                        <span class="aim-pick-label" id="aimMapLabel">map</span>
                        <div class="aim-chips" id="aimMaps" role="radiogroup" aria-labelledby="aimMapLabel"></div>
                    </div>
                    <div class="aim-pick">
                        <label class="aim-pick-label" for="aimSensRange">sensitivity</label>
                        <div class="aim-sens">
                            <input class="aim-sens-range" id="aimSensRange" type="range" min="0.2" max="8" step="0.05" value="2.5">
                            <input class="aim-sens-value" id="aimSensValue" type="number" min="0.2" max="8" step="0.05" value="2.5" aria-label="sensitivity value">
                        </div>
                    </div>
                    <div class="aim-pick">
                        <span class="aim-pick-label" id="aimXhLabel">crosshair</span>
                        <div class="aim-chips" id="aimCrosshairs" role="radiogroup" aria-labelledby="aimXhLabel"></div>
                        <div class="aim-swatches">
                            <div class="aim-swatch-row" id="aimXhColors" role="radiogroup" aria-label="crosshair colour"></div>
                            <!-- A live copy of the crosshair, since the real one only shows mid-round. -->
                            <div class="aim-crosshair aim-crosshair-preview" id="aimXhPreview" aria-hidden="true">
                                <span></span><span></span><span></span><span></span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="aim-actions">
                    <button class="aim-btn aim-btn-go" id="aimStart" type="button" disabled>loading…</button>
                    <button class="aim-btn" id="aimSaveOpen" type="button" hidden>save score</button>
                    <button class="aim-btn" id="aimReset" type="button">reset score</button>
                    <button class="aim-btn" id="aimSound" type="button" aria-pressed="true">sound on</button>
                    <button class="aim-btn" id="aimFullscreen" type="button" hidden>fullscreen</button>
                </div>

                <!-- Shown after a round with at least one hit. -->
                <form class="aim-save" id="aimSave" hidden>
                    <label class="aim-save-label" for="aimName">name on the board</label>
                    <div class="aim-save-row">
                        <input class="aim-input" id="aimName" name="name" type="text" maxlength="20"
                               autocomplete="nickname" spellcheck="false" placeholder="your name" required>
                        <button class="aim-btn aim-btn-go" id="aimSaveBtn" type="submit">save</button>
                    </div>
                    <p class="aim-save-msg" id="aimSaveMsg" aria-live="polite"></p>
                </form>

                <p class="aim-hint" id="aimHint">click to fire &middot; move to aim &middot; f to inspect &middot; esc to pause</p>
            </div>

            <aside class="aim-side">
                <figure class="aim-inspo">
                    <img src="images/aim-inspo.jpg" alt="Two brothers as kids in red Lions jerseys, sitting on the floor playing csgo on laptops">
                    <figcaption>this was inspired by my love for csgo. me and my brother playing it as kids.</figcaption>
                </figure>

                <section class="aim-board" aria-labelledby="aimBoardTitle">
                    <h2 class="aim-side-title nostyle" id="aimBoardTitle">leaderboard</h2>
                    <ol class="aim-board-list" id="aimBoard"></ol>
                    <p class="aim-board-empty" id="aimBoardEmpty">loading…</p>
                </section>
            </aside>
        </div>

        <p class="aim-note" id="aimNote" hidden></p>
    </div>

    <script src="script.js"></script>
    <script type="module" src="aim.js"></script>
</body>
</html>
